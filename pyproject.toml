[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "civil-os"
version = "0.1.0"
description = "CIVIL-OS Phase 1: Project Context Engine (schemas, ECP assembler, basic CPO)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5"]


[project.optional-dependencies]
dev = ["pytest>=7.4"]


[tool.setuptools.packages.find]
include = ["civil_os*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
